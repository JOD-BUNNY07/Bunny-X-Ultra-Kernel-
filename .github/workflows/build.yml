name: NitroX -Zenith  (KSUN) Kernel Build

on:
  push:
    branches:
      - Nitro-X-KSU 
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "Nitro-X-KSU

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
           ref: ${{ github.event.inputs.branch }}

      - name: 🧰 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl zip bc bison flex \
            libssl-dev libelf-dev \
            ccache build-essential

      - name: 🛠 Make Build Script Executable
        run: chmod +x build.sh

      - name: 🚀 Run Kernel Build
        env:
          KBUILD_BUILD_USER: JOD_Bunny
          KBUILD_BUILD_HOST: BUNNY-X
          KBUILD_BUILD_TIMESTAMP: "{{- now('+%a %b %d %H:%M:%S UTC %Y', timezone='UTC') -}}"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./build.sh

      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitroX-zenith-Kernel
          path: output/*.zip
